<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurino Tavern - Back of House Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #8B7355;
            --secondary-dark: #A68B6B;
            --tertiary-dark: #2C5F7C;
            --blue-pastel: #7FA7B8;
            --background: #FAF8F5;
            --accent: #E8DFD3;
            --highlight: #D4A574;
            --card-background: #ffffff;
            --border: #e0e0e0;
            --text: #8B7355;
            --text-primary: #5a4a3a;
            --muted-text: #A68B6B;
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.12);
            --radius-medium: 8px;
            --radius-large: 12px;
        }

        [data-theme="dark"] {
            --primary-dark: #D4A574;
            --secondary-dark: #A68B6B;
            --tertiary-dark: #7FA7B8;
            --blue-pastel: #5a8a9a;
            --background: #1a1612;
            --accent: #2a2420;
            --highlight: #D4A574;
            --card-background: #252018;
            --border: #3a3530;
            --text: #E8DFD3;
            --text-primary: #ffffff;
            --muted-text: #A68B6B;
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100vh;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .header-left .subtitle {
            font-size: 0.75rem;
            color: var(--tertiary-dark);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-date {
            font-size: 0.85rem;
            color: var(--secondary-dark);
            font-weight: 500;
        }

        .theme-toggle {
            background: var(--card-background);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: var(--radius-medium);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'Source Sans Pro', sans-serif;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--tertiary-dark);
            color: white;
        }

        .schedule-container {
            flex: 1;
            background: var(--card-background);
            border-radius: var(--radius-large);
            padding: 12px;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .schedule-scroll {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: 0;
            cursor: grab;
        }

        .schedule-scroll:active {
            cursor: grabbing;
        }

        .schedule-scroll.iframed {
            overflow-x: hidden;
        }

        .schedule-grid {
            display: grid;
            gap: 6px;
            height: 100%;
            min-width: max-content;
        }

        .day-column {
            display: flex;
            flex-direction: column;
            background: var(--background);
            border-radius: var(--radius-medium);
            overflow: hidden;
            width: 110px;
            min-width: 110px;
        }

        .day-column.today {
            border: 2px solid var(--highlight);
            background: rgba(212, 165, 116, 0.1);
        }

        .day-header {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .day-name {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--tertiary-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .day-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .day-column.today .day-date {
            color: var(--highlight);
        }

        .day-shifts {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .shift-card {
            background: var(--card-background);
            border-radius: 4px;
            padding: 4px 6px;
            border-left: 3px solid var(--tertiary-dark);
        }

        .shift-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shift-type {
            font-size: 0.55rem;
            color: var(--tertiary-dark);
            font-weight: 500;
        }

        .shift-time {
            font-size: 0.55rem;
            color: var(--muted-text);
        }

        .shift-card[data-type="expo"] { border-left-color: #5C5C5C; }
        .shift-card[data-type="salad"] { border-left-color: #6B8E5A; }
        .shift-card[data-type="dish"] { border-left-color: #5A7A8E; }
        .shift-card[data-type="dish + salad"] { border-left-color: #5E8E7A; }
        .shift-card[data-type="am prep cook"] { border-left-color: #8E7A5A; }
        .shift-card[data-type="am prep pizza"] { border-left-color: #A65A5A; }
        .shift-card[data-type="am prep"] { border-left-color: #7A5A8E; }
        .shift-card[data-type="saute"] { border-left-color: #C75A5A; }
        .shift-card[data-type="pm pizza"] { border-left-color: #B85A7A; }

        .no-shifts {
            font-size: 0.6rem;
            color: var(--muted-text);
            text-align: center;
            padding: 8px 4px;
            font-style: italic;
        }

        .footer {
            text-align: center;
            padding-top: 6px;
            font-size: 0.6rem;
            color: var(--muted-text);
            flex-shrink: 0;
        }

        .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .schedule-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 6px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            background: var(--card-background);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: var(--radius-medium);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'Source Sans Pro', sans-serif;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--tertiary-dark);
            color: white;
        }

        .date-range {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 140px;
            text-align: center;
        }

        ::-webkit-scrollbar { width: 3px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--background); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>Laurino Tavern</h1>
            <div class="subtitle">Back of House Schedule</div>
        </div>
        <div class="header-right">
            <div class="current-date" id="currentDate"></div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙 Dark</button>
        </div>
    </header>

    <nav class="schedule-nav" id="scheduleNav" style="display: none;">
        <button class="nav-btn" onclick="scrollSchedule(-14)">&#8249; Prev 2 Weeks</button>
        <span class="date-range" id="dateRange"></span>
        <button class="nav-btn" onclick="resetScheduleView()">Today</button>
        <button class="nav-btn" onclick="scrollSchedule(14)">Next 2 Weeks &#8250;</button>
    </nav>

    <main class="schedule-container">
        <div class="schedule-scroll" id="scheduleScroll">
            <div class="schedule-grid" id="scheduleGrid"></div>
        </div>
    </main>

    <footer class="footer">
        <span class="status-dot"></span>
        Auto-refresh enabled · Last updated: <span id="lastUpdated">--</span> · 
        <span id="recordCount">0</span> records loaded
    </footer>

    <script>
        const CONFIG = {
            DATABASE_ID: '2f142fe3226481529630f2c86425ece8',
            API_ENDPOINT: '/api/notion',
            REFRESH_INTERVAL: 300000,
            TOTAL_DAYS: 56
        };

        let scheduleData = {};
        let startDateOffset = 0;
        const isIframed = window.self !== window.top;
        const DISPLAY_DAYS = isIframed ? 14 : CONFIG.TOTAL_DAYS;

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('schedule-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }

        function loadTheme() {
            const saved = localStorage.getItem('schedule-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️ Light' : '🌙 Dark';
        }

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTime(timeNum) {
            if (!timeNum) return '';
            const str = String(timeNum).padStart(4, '0');
            const hours = parseInt(str.substring(0, 2));
            const mins = str.substring(2);
            const ampm = hours >= 12 ? 'pm' : 'am';
            const h = hours > 12 ? hours - 12 : (hours === 0 ? 12 : hours);
            return `${h}:${mins}${ampm}`;
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function fetchSchedule() {
            try {
                const response = await fetch(CONFIG.API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ databaseId: CONFIG.DATABASE_ID })
                });
                if (!response.ok) throw new Error('API error: ' + response.status);
                return await response.json();
            } catch (error) {
                console.error('Error fetching schedule:', error);
                return null;
            }
        }

        async function loadSchedule() {
            const data = await fetchSchedule();
            if (!data || !data.results) {
                console.error('No data returned from API');
                return;
            }

            console.log('=== BOH SCHEDULE DEBUG ===');
            console.log('Total records received:', data.results.length);
            document.getElementById('recordCount').textContent = data.results.length;

            if (data.results.length > 0) {
                console.log('First record full structure:', JSON.stringify(data.results[0], null, 2));
                console.log('First record properties:', Object.keys(data.results[0].properties));
            }

            scheduleData = {};
            let parsedCount = 0;
            let skippedCount = 0;

            data.results.forEach((page, index) => {
                const props = page.properties;
                let dateValue = null;
                let name = null;
                let shiftType = null;
                let timeIn = null;

                if (index < 5) {
                    console.log(`\n--- Record ${index + 1} ---`);
                }

                for (const [key, prop] of Object.entries(props)) {
                    const keyLower = key.toLowerCase().trim();

                    if (index < 5) {
                        console.log(`  ${key} (${prop.type}):`, JSON.stringify(prop[prop.type]));
                    }

                    if (prop.type === 'date' && prop.date) {
                        dateValue = prop.date.start.split('T')[0];
                    }

                    if (keyLower === 'employee') {
                        if (prop.type === 'select' && prop.select) {
                            name = prop.select.name;
                        } else if (prop.type === 'multi_select' && prop.multi_select && prop.multi_select.length > 0) {
                            name = prop.multi_select[0].name;
                        } else if (prop.type === 'rich_text' && prop.rich_text && prop.rich_text.length > 0) {
                            name = prop.rich_text[0].plain_text;
                        }
                    }

                    if (prop.type === 'title' && prop.title && prop.title.length > 0) {
                        if (!name) {
                            name = prop.title[0].plain_text;
                        }
                    }

                    if (keyLower === 'shift type' || keyLower === 'shift_type' || keyLower === 'shifttype') {
                        if (prop.type === 'select' && prop.select) {
                            shiftType = prop.select.name;
                        } else if (prop.type === 'multi_select' && prop.multi_select && prop.multi_select.length > 0) {
                            shiftType = prop.multi_select[0].name;
                        }
                    }

                    if (keyLower === 'time in' || keyLower === 'time_in' || keyLower === 'timein') {
                        if (prop.type === 'number' && prop.number !== null) {
                            timeIn = prop.number;
                        }
                    }
                }

                if (index < 5) {
                    console.log(`  PARSED: date=${dateValue}, name=${name}, shift=${shiftType}, time=${timeIn}`);
                }

                if (dateValue && name) {
                    if (!scheduleData[dateValue]) scheduleData[dateValue] = [];
                    scheduleData[dateValue].push({ name, shiftType, timeIn });
                    parsedCount++;
                } else {
                    skippedCount++;
                    if (index < 10) {
                        console.log(`  SKIPPED: missing date or name`);
                    }
                }
            });

            console.log('\n=== PARSING SUMMARY ===');
            console.log('Parsed successfully:', parsedCount);
            console.log('Skipped (missing data):', skippedCount);
            console.log('Unique dates with shifts:', Object.keys(scheduleData).length);
            console.log('Dates:', Object.keys(scheduleData).sort());

            for (const date in scheduleData) {
                scheduleData[date].sort((a, b) => (a.timeIn || 0) - (b.timeIn || 0));
            }

            const today = new Date();
            console.log('\n=== NEXT 14 DAYS ===');
            for (let i = 0; i < 14; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const key = getLocalDateKey(d);
                const shifts = scheduleData[key] || [];
                console.log(`${key}: ${shifts.length} shifts`, shifts.map(s => s.name).join(', '));
            }

            renderSchedule();
        }

        function scrollSchedule(delta) {
            startDateOffset += delta;
            renderSchedule();
        }

        function resetScheduleView() {
            startDateOffset = 0;
            renderSchedule();
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${DISPLAY_DAYS}, 110px)`;

            const today = new Date();
            const todayKey = getLocalDateKey(today);
            const baseDate = new Date(today);
            baseDate.setDate(today.getDate() + startDateOffset);

            if (!isIframed) {
                const endDate = new Date(baseDate);
                endDate.setDate(baseDate.getDate() + DISPLAY_DAYS - 1);
                const rangeEl = document.getElementById('dateRange');
                if (rangeEl) {
                    const start = baseDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const end = endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    rangeEl.textContent = `${start} – ${end}`;
                }
            }

            for (let i = 0; i < DISPLAY_DAYS; i++) {
                const date = new Date(baseDate);
                date.setDate(baseDate.getDate() + i);
                const dateKey = getLocalDateKey(date);
                const isToday = dateKey === todayKey;

                const dayColumn = document.createElement('div');
                dayColumn.className = 'day-column' + (isToday ? ' today' : '');

                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = date.getDate();

                dayColumn.innerHTML = `
                    <div class="day-header">
                        <div class="day-name">${dayName}</div>
                        <div class="day-date">${dayNum}</div>
                    </div>
                    <div class="day-shifts" id="shifts-${dateKey}"></div>
                `;

                grid.appendChild(dayColumn);

                const shiftsContainer = dayColumn.querySelector('.day-shifts');
                const shifts = scheduleData[dateKey] || [];

                if (shifts.length === 0) {
                    shiftsContainer.innerHTML = '<div class="no-shifts">—</div>';
                } else {
                    shifts.forEach(shift => {
                        const shiftCard = document.createElement('div');
                        shiftCard.className = 'shift-card';
                        shiftCard.setAttribute('data-type', (shift.shiftType || '').toLowerCase());
                        shiftCard.innerHTML = `
                            <div class="shift-name">${shift.name}</div>
                            <div class="shift-type">${shift.shiftType || ''}</div>
                            <div class="shift-time">${formatTime(shift.timeIn)}</div>
                        `;
                        shiftsContainer.appendChild(shiftCard);
                    });
                }
            }
        }

        function setupDragScroll() {
            const el = document.getElementById('scheduleScroll');
            let isDown = false;
            let startX;
            let scrollLeft;

            el.addEventListener('mousedown', (e) => {
                isDown = true;
                el.classList.add('active');
                startX = e.pageX - el.offsetLeft;
                scrollLeft = el.scrollLeft;
            });

            el.addEventListener('mouseleave', () => {
                isDown = false;
            });

            el.addEventListener('mouseup', () => {
                isDown = false;
            });

            el.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - el.offsetLeft;
                const walk = (x - startX) * 1.5;
                el.scrollLeft = scrollLeft - walk;
            });
        }

        function updateUI() {
            document.getElementById('currentDate').textContent = formatDate(new Date());
            document.getElementById('lastUpdated').textContent = 
                new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        async function init() {
            loadTheme();
            updateUI();
            await loadSchedule();

            if (isIframed) {
                document.getElementById('scheduleScroll').classList.add('iframed');
            } else {
                document.getElementById('scheduleNav').style.display = 'flex';
                setupDragScroll();
            }
        }

        async function refresh() {
            await loadSchedule();
            updateUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();
            setInterval(refresh, CONFIG.REFRESH_INTERVAL);
        });
    </script>
</body>
</html>
